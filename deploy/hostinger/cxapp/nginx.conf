server {
    listen 80;
    listen [::]:80;
    server_name mail-api.codexsun.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/codexsun-acme; default_type text/plain; try_files $uri =404; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mail-api.codexsun.com;
    ssl_certificate /etc/letsencrypt/live/mail-api.codexsun.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail-api.codexsun.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12k;
    location = /enquiry {
        proxy_pass http://127.0.0.1:3110/enquiry;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}
