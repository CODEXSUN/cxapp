version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: "Asia/Kolkata"
    allow:
      - dependency-name: "@codexsun/blog"
      - dependency-name: "@codexsun/file-manager"
    versioning-strategy: increase
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - addons
