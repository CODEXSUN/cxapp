name: Windows release

on:
  push:
    tags:
      - "v-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install repository dependencies
        run: npm ci

      - name: Validate the tag and repository version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v-$version"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag ${{ github.ref_name }} must match $expectedTag."
          }
          npm run check:versions

      - name: Validate source and Windows host
        run: |
          npm run check
          npm run desktop:build

      - name: Load the signing certificate
        id: signing
        shell: pwsh
        env:
          SIGNING_PASSWORD: ${{ secrets.CXAPP_WINDOWS_SIGNING_PASSWORD }}
          SIGNING_PFX_BASE64: ${{ secrets.CXAPP_WINDOWS_SIGNING_PFX }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64 -or -not $env:SIGNING_PASSWORD) {
            throw "Add CXAPP_WINDOWS_SIGNING_PFX and CXAPP_WINDOWS_SIGNING_PASSWORD repository secrets."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "cxapp-windows-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_PASSWORD -AsPlainText -Force
          $certificate = Get-PfxData -FilePath $pfxPath -Password $password
          $signingCertificate = $certificate.EndEntityCertificates[0]
          $publisher = $signingCertificate.Subject
          $certificatePath = Join-Path $env:RUNNER_TEMP "CXApp.Windows.cer"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            $signingCertificate.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          )
          $store = [Security.Cryptography.X509Certificates.X509Store]::new(
            [Security.Cryptography.X509Certificates.StoreName]::TrustedPeople,
            [Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
          )
          try {
            $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
            $store.Add($signingCertificate)
          } finally {
            $store.Close()
          }
          "pfx_path=$pfxPath" >> $env:GITHUB_OUTPUT
          "publisher=$publisher" >> $env:GITHUB_OUTPUT
          "certificate_path=$certificatePath" >> $env:GITHUB_OUTPUT

      - name: Build and sign MSIX release assets
        shell: pwsh
        env:
          PACKAGE_PUBLISHER: ${{ steps.signing.outputs.publisher }}
          SIGNING_PASSWORD: ${{ secrets.CXAPP_WINDOWS_SIGNING_PASSWORD }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./apps/platform/windows/scripts/package.ps1 `
            -Version $version `
            -Publisher $env:PACKAGE_PUBLISHER `
            -SigningPfx '${{ steps.signing.outputs.pfx_path }}' `
            -SigningPassword $env:SIGNING_PASSWORD `
            -PublicCertificatePath '${{ steps.signing.outputs.certificate_path }}' `
            -AllowSelfSignedCertificate

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @(
            "dist/releases/windows/CXApp.Windows.msix",
            "dist/releases/windows/Microsoft.WindowsAppRuntime.2.msix",
            "dist/releases/windows/CXApp.Windows.appinstaller",
            "dist/releases/windows/CXApp.Windows.cer",
            "dist/releases/windows/Install-CXApp.ps1",
            "dist/releases/windows/Uninstall-CXApp.ps1",
            "dist/releases/windows/SHA256SUMS.txt"
          )
          gh release view "${{ github.ref_name }}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" @assets --clobber
            gh release edit "${{ github.ref_name }}" --latest --title "CXApp $version"
          } else {
            gh release create "${{ github.ref_name }}" @assets `
              --generate-notes `
              --latest `
              --title "CXApp $version" `
              --verify-tag
          }
